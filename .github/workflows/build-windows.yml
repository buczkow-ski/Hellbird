name: Build Windows (x64)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'CMake build preset'
        type: choice
        default: 'Distribution'
        options:
          - Distribution
          - Release
          - Debug
  workflow_call:
    inputs:
      preset:
        type: string
        default: 'Distribution'

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (${{ inputs.preset || 'Distribution' }}, ClangCL)
    runs-on: windows-2025
    timeout-minutes: 300

    env:
      PRESET: ${{ inputs.preset || 'Distribution' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -v"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_IDLE_TIMEOUT: 0

    steps:
      - name: Checkout Hellbird
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare patched Ladybird source tree
        shell: pwsh
        run: python tools/hellbird.py prepare --upstream upstream/ladybird

      - name: Install Windows build tooling (ccache, sccache, Clang >= 22, wasm-tools)
        shell: bash
        run: |
          choco install -y ccache sccache --no-progress

          # MSVC 14.52+ (Visual Studio 2026 on windows-2025) requires Clang 22 or newer for STL headers.
          # Prefer Visual Studio's bundled LLVM if >= 22, otherwise upgrade Chocolatey LLVM to >= 22.
          clang_major() {
            local bin="$1"
            if [ -x "${bin}" ]; then
              "${bin}" --version 2>/dev/null | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -n1
            fi
          }

          CHOSEN_LLVM_DIR=""
          VS_INSTALL="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>/dev/null | tr -d '\r')"
          if [ -n "${VS_INSTALL}" ]; then
            VS_LLVM_WIN="${VS_INSTALL}\\VC\\Tools\\Llvm\\x64\\bin"
            VS_LLVM_POSIX="$(cygpath -u "${VS_LLVM_WIN}")"
            VS_VER="$(clang_major "${VS_LLVM_POSIX}/clang-cl.exe")"
            echo "VS bundled clang-cl version: ${VS_VER:-none} (${VS_LLVM_WIN})"
            if [ -n "${VS_VER}" ] && [ "${VS_VER}" -ge 22 ]; then
              CHOSEN_LLVM_DIR="${VS_LLVM_WIN}"
            fi
          fi

          if [ -z "${CHOSEN_LLVM_DIR}" ]; then
            CUR_VER="$(clang_major "/c/Program Files/LLVM/bin/clang-cl.exe")"
            echo "Preinstalled LLVM clang-cl version: ${CUR_VER:-none}"
            if [ -z "${CUR_VER}" ] || [ "${CUR_VER}" -lt 22 ]; then
              choco upgrade -y llvm --no-progress
            fi
            CHOSEN_LLVM_DIR="C:\\Program Files\\LLVM\\bin"
          fi

          CHOSEN_LLVM_POSIX="$(cygpath -u "${CHOSEN_LLVM_DIR}")"
          echo "${CHOSEN_LLVM_DIR}" >> "${GITHUB_PATH}"
          echo "HELLBIRD_LLVM_BIN=${CHOSEN_LLVM_DIR}" >> "${GITHUB_ENV}"
          export PATH="${CHOSEN_LLVM_POSIX}:${PATH}"
          which clang-cl
          clang-cl --version
          FINAL_VER="$(clang_major "${CHOSEN_LLVM_POSIX}/clang-cl.exe")"
          if [ -z "${FINAL_VER}" ] || [ "${FINAL_VER}" -lt 22 ]; then
            echo "ERROR: Expected Clang >= 22 for VS 2026 STL headers, got '${FINAL_VER}'" >&2
            exit 1
          fi

          WASM_TOOLS_VER=1.243.0
          WASM_NAME="wasm-tools-${WASM_TOOLS_VER}-x86_64-windows"
          URL="https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VER}/${WASM_NAME}.zip"
          delays=(5 15 45)
          attempt=1
          until curl --fail --location --output "${WASM_NAME}.zip" "${URL}"; do
            if (( attempt > ${#delays[@]} )); then
              echo "wasm-tools download failed after retries" >&2
              exit 1
            fi
            sleep "${delays[attempt-1]}"
            attempt=$(( attempt + 1 ))
          done
          unzip -q "${WASM_NAME}.zip"
          rm "${WASM_NAME}.zip"
          mv "${WASM_NAME}" "${GITHUB_WORKSPACE}/wasm-tools"
          echo "${GITHUB_WORKSPACE}/wasm-tools" >> "${GITHUB_PATH}"

      - name: Warm up Rust toolchain & cargo dependencies
        working-directory: ${{ github.workspace }}/upstream/ladybird
        shell: bash
        run: |
          rustup toolchain install
          cargo --version
          rustc --version
          for manifest in Cargo.toml Libraries/LibJS/Flap/Cargo.toml; do
            if [ -f "${manifest}" ]; then
              cargo fetch --locked --manifest-path "${manifest}"
            fi
          done

      - name: Restore ccache, sccache, vcpkg, and cargo caches
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            .sccache
            upstream/ladybird/Build/caches/vcpkg-binary-cache
            ~/.cargo/registry
          key: hellbird-windows-x64-${{ env.PRESET }}-${{ hashFiles('ladybird_revision.txt', 'patches/**', 'resources/**', 'tools/**') }}-${{ github.run_id }}
          restore-keys: |
            hellbird-windows-x64-${{ env.PRESET }}-${{ hashFiles('ladybird_revision.txt', 'patches/**', 'resources/**', 'tools/**') }}-
            hellbird-windows-x64-${{ env.PRESET }}-
            hellbird-windows-x64-

      - name: Bootstrap pinned vcpkg matching preset
        shell: pwsh
        run: python tools/hellbird.py bootstrap-vcpkg --upstream upstream/ladybird --preset $env:PRESET

      - name: Initialize Visual Studio x64 Developer Environment, Build & Package Hellbird
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "HELLBIRD_VS_DIR=%%i"
          if not defined HELLBIRD_VS_DIR (
            echo Visual Studio x64 C++ build tools not found >&2
            exit /b 1
          )
          call "%HELLBIRD_VS_DIR%\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%HELLBIRD_LLVM_BIN%;%PATH%"
          echo VCToolsInstallDir=%VCToolsInstallDir%
          echo LIB=%LIB%
          where clang-cl
          clang-cl --version
          python tools\hellbird.py build --upstream upstream\ladybird --preset %PRESET% --no-tests --target ladybird
          if errorlevel 1 exit /b 1
          python tools\hellbird.py package --upstream upstream\ladybird --preset %PRESET% --out dist

      - name: Save caches (even if build fails or times out early)
        if: always() && steps.cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            .sccache
            upstream/ladybird/Build/caches/vcpkg-binary-cache
            ~/.cargo/registry
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: hellbird-windows-x64-${{ env.PRESET }}
          path: dist/hellbird-*-Windows-x86_64.zip
          if-no-files-found: error
