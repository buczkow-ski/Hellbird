name: Release Hellbird (Windows + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release tag matches version.txt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Hellbird
        uses: actions/checkout@v4
      - name: Check tag against version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(tr -d '\r\n' < version.txt)"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag '${TAG}' does not match version.txt ('v${VERSION}')" >&2
            exit 1
          fi

  linux:
    needs: [validate-version]
    uses: ./.github/workflows/build-linux.yml
    with:
      preset: Distribution
      package_format: all
      target_distro: ubuntu-24.04

  windows:
    needs: [validate-version]
    uses: ./.github/workflows/build-windows.yml
    with:
      preset: Distribution

  publish:
    name: Create GitHub Release
    needs: [validate-version, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Hellbird
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.2.1
        with:
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
